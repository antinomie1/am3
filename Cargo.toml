[package]
name = "am3"
description = "Material 3 Expressive controls for Aegle"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/antinomie1/am3"
readme = "README.md"
keywords = ["gui", "material", "material-design", "controls"]
categories = ["gui"]

[features]
default = ["motion"]
# Spring transitions and the library's own animations (ripples, shape
# morphs, indeterminate progress); without it controls snap to new states.
motion = ["aegle-ui/motion", "aegle-widgets/motion", "aegle-loader/motion"]
# Semantic roles and actions for assistive technology.
accessibility = ["aegle-ui/accessibility", "aegle-widgets/accessibility", "dep:aegle-access"]

[dependencies]
aegle-ui = { git = "https://github.com/antinomie1/aegle", branch = "main" }
aegle-widgets = { git = "https://github.com/antinomie1/aegle", branch = "main" }
aegle-loader = { git = "https://github.com/antinomie1/aegle", branch = "main" }
aegle-controls = { git = "https://github.com/antinomie1/aegle", branch = "main", features = ["text"] }
aegle-motion = { git = "https://github.com/antinomie1/aegle", branch = "main" }
aegle-layout = { git = "https://github.com/antinomie1/aegle", branch = "main" }
aegle-text = { git = "https://github.com/antinomie1/aegle", branch = "main", features = ["scene"] }
aegle-access = { git = "https://github.com/antinomie1/aegle", branch = "main", optional = true }

[dev-dependencies]
aegle-render-software = { git = "https://github.com/antinomie1/aegle", branch = "main", features = ["text"] }
png = "0.18"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 2
